services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: homecare
      POSTGRES_USER: homecare
      POSTGRES_PASSWORD: homecare
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U homecare -d homecare']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - homecare_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  homecare_postgres:
